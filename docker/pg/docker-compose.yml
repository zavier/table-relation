services:
  postgres:
    image: postgres:16
    container_name: table-relation-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      # 与本地已有 PG 实例错开端口，可按需修改
      - "127.0.0.1:5544:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20
